                { name: "Susulan Wall & Floor", link: "https://docs.google.com/forms/d/e/1FAIpQLScZMv1U05-wsC475XvKGb4WEsGZd8Y3LBGfNJOaA4jCPqktnQ/viewform" },
                { name: "Susulan Kerajinan Interior", link: "https://docs.google.com/forms/d/e/1FAIpQLSfm_1DxnKu-YV_kRfooi775uzqf2xRbh-OZ_Emf4FNslC1Irw/viewform" }
              ]
            }
          ]
        }
      ]
    };

    const monthMap = {
      "Januari": 0, "Februari": 1, "Maret": 2, "April": 3, "Mei": 4, "Juni": 5,
      "Juli": 6, "Agustus": 7, "September": 8, "Oktober": 9, "November": 10, "Desember": 11
    };

    function App() {
      const [screen, setScreen] = useState('welcome');
      const [nisnInput, setNisnInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [currentStudent, setCurrentStudent] = useState('');
      const [currentNisn, setCurrentNisn] = useState('');
      const [currentClass, setCurrentClass] = useState('');

      const [examSchedule, setExamSchedule] = useState([]);
      const [activeDayId, setActiveDayId] = useState(1);

      const [confirmModal, setConfirmModal] = useState({ show: false, subject: '', link: '' });
      const [logoutModal, setLogoutModal] = useState(false);
      const [navAlert, setNavAlert] = useState({ show: false, title: '', msg: '' });
      const [exitFrameModal, setExitFrameModal] = useState(false);
      const [groupModal, setGroupModal] = useState({ show: false, subjectName: '', options: [] });

      const [iframeLink, setIframeLink] = useState('');
      const [iframeTitle, setIframeTitle] = useState('');
      const [iframeLoading, setIframeLoading] = useState(true);

      useEffect(() => {
        const handleContextMenu = (e) => e.preventDefault();
        document.addEventListener("contextmenu", handleContextMenu);
        return () => document.removeEventListener("contextmenu", handleContextMenu);
      }, []);

      const isDayVisible = (day) => {
        if (currentNisn === "ADMIN") return true; 
        const parts = day.date.split(" ");
        if (parts.length !== 3) return true;

        const dayDate = new Date(parseInt(parts[2]), monthMap[parts[1]], parseInt(parts[0]), 0, 0, 0);
        const endOfDay = new Date(parseInt(parts[2]), monthMap[parts[1]], parseInt(parts[0]), 23, 59, 59);

        if (day.id === 0) { 
          const now = new Date();
          const startDate = new Date(2026, 10, 10, 0, 0, 0); 
          const endDate = new Date(2026, 10, 24, 23, 59, 59); 
          return (now >= startDate && now <= endDate);
        }

        const now = new Date();
        return now >= dayDate && now <= endOfDay;
      };

      const getSubjectStatus = (day, subject) => {
        if (subject.isSpecial && currentNisn !== "ADMIN" && !specialStudentsList.includes(currentStudent)) {
          return { status: "UNAUTHORIZED" };
        }

        if (currentNisn === "ADMIN") return { status: "OPEN" };
        const parts = day.date.split(" ");
        if (parts.length !== 3) return { status: "OPEN" };

        let startH = 0, startM = 0, endH = 0, endM = 0;
        if (subject.time && subject.time.includes("-")) {
          const timeParts = subject.time.split("-");
          const sParts = timeParts[0].trim().split(":");
          const eParts = timeParts[1].trim().split(":");
          startH = parseInt(sParts[0]) || 0;
          startM = parseInt(sParts[1]) || 0;
          endH = parseInt(eParts[0]) || 0;
          endM = parseInt(eParts[1]) || 0;
        }

        const year = parseInt(parts[2]);
        const month = monthMap[parts[1]];
        const date = parseInt(parts[0]);

        const now = new Date();

        if (day.id === 0) {
          const startRange = new Date(2026, 10, 10, startH, startM, 0); 
          const endRange = new Date(2026, 10, 24, endH, endM, 0);
          if (now >= startRange && now <= endRange) {
            return { status: "OPEN" };
          } else {
            return { status: "CLOSED" };
          }
        }

        const startTime = new Date(year, month, date, startH, startM, 0);
        const unlockTime = new Date(startTime.getTime() + 15 * 60000); 
        const closeTime = new Date(year, month, date, endH, endM, 0);

        if (now < unlockTime) {
          const hh = String(unlockTime.getHours()).padStart(2, '0');
          const mm = String(unlockTime.getMinutes()).padStart(2, '0');
          return { status: "WAITING", unlockTimeStr: `${hh}:${mm}` };
        }

        if (now > closeTime) return { status: "CLOSED" };

        return { status: "OPEN" };
      };

      const formatHeaderName = (fullName) => {
        if (!fullName || fullName === "ADMINISTRATOR") return fullName;
        const words = fullName.trim().split(/\s+/);
        if (words.length > 2) {
          return words[0] + " " + words[1];
        }
        return fullName;
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const cleanedNisn = nisnInput.trim();
        const cleanedPassword = passwordInput.trim();

        if (cleanedNisn === "" || cleanedPassword === "") {
          setLoginError('Mohon lengkapi NISN dan Password Anda!');
          return;
        }

        if (cleanedNisn.toUpperCase() === "ADMIN" && (cleanedPassword === "1234" || cleanedPassword.toUpperCase() === "ADMIN")) {
          setLoginError('');
          setCurrentStudent("ADMINISTRATOR");
          setCurrentNisn("ADMIN");
          setScreen('class-select');
          return;
        }

        if (cleanedPassword !== "1234") {
          setLoginError('Password salah! (Gunakan password: 1234)');
          return;
        }

        let validNameInDb = null;
        let foundClass = null;
        let matchFound = false;

        const cleanInputNisn = cleanedNisn.replace(/\D/g, '');
        const inputNisnNum = parseInt(cleanInputNisn, 10);

        for (const className in studentDatabase) {
          const nisnKeys = Object.keys(studentDatabase[className]);
          for (const key of nisnKeys) {
            const cleanKey = key.replace(/\D/g, '');
            if (key === cleanedNisn || (cleanInputNisn !== "" && cleanKey === cleanInputNisn) || (!isNaN(inputNisnNum) && parseInt(cleanKey, 10) === inputNisnNum)) {
              validNameInDb = studentDatabase[className][key];
              foundClass = className;
              matchFound = true;
              break;
            }
          }
          if (matchFound) break;
        }

        if (!matchFound) {
          setLoginError('Akses ditolak! NISN tidak terdaftar dalam sistem.');
          return;
        }

        setLoginError('');
        setCurrentStudent(validNameInDb);
        setCurrentNisn(cleanedNisn);
        setCurrentClass(foundClass);

        const activeSchedule = schedules[foundClass] || schedules["Kelas X"];
        setExamSchedule(activeSchedule);

        const visibleDays = activeSchedule.filter(day => isDayVisible(day));
        if (visibleDays.length > 0) {
          setActiveDayId(visibleDays[0].id);
        }

        setScreen('dashboard');
      };

      const selectClassForAdmin = (className) => {
        setCurrentClass(className);
        const activeSchedule = schedules[className] || schedules["Kelas X"];
        setExamSchedule(activeSchedule);

        const visibleDays = activeSchedule.filter(day => isDayVisible(day));
        if (visibleDays.length > 0) {
          setActiveDayId(visibleDays[0].id);
        }
        setScreen('dashboard');
      };

      const handleLogout = () => {
        setNisnInput('');
        setPasswordInput('');
        setCurrentStudent('');
        setCurrentNisn('');
        setCurrentClass('');
        setLogoutModal(false);
        setScreen('welcome');
      };

      const startExam = (subjectName, link) => {
        setIframeTitle(subjectName);
        setIframeLoading(true);

        let finalLink = link;
        if (finalLink.includes("docs.google.com/forms") && !finalLink.includes("embedded=true")) {
          finalLink = finalLink.includes("?") ? finalLink + "&embedded=true" : finalLink + "?embedded=true";
        }

        setIframeLink(finalLink);
        setScreen('exam-frame');
        setConfirmModal({ show: false, subject: '', link: '' });
      };

      return (
        <div className="h-full w-full relative">
          
          {screen === 'welcome' && (

              <div className="w-full max-w-md bg-slate-900/90 backdrop-blur-md border border-blue-800/50 rounded-[2rem] p-8 pt-16 shadow-2xl relative mt-12 animate-fade-in text-center">
                
                <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 w-24 h-24 rounded-full shadow-lg bg-blue-950 flex items-center justify-center p-2 border-2 border-blue-500/40">
                  <img 
                    src="https://romantic-red-yjloxbvez0.edgeone.app/SMKn4.png" 
                    alt="Logo Sekolah" 
                    className="max-w-full max-h-full object-contain" 
                    onError={(e) => {
                      e.target.onerror = null;
                      e.target.src = 'https://ui-avatars.com/api/?name=SMKN+4&background=2563eb&color=fff&rounded=true&size=128';
                    }}
                  />
                </div>

                <div className="mb-8 mt-2">
                  <h1 className="text-[1.35rem] font-extrabold text-white tracking-tight mb-2 leading-snug">Penilaian Sumatif Kenaikan Kelas</h1>
                  <p className="text-[10px] font-bold text-blue-300 bg-blue-900/50 border border-blue-700/60 inline-block px-3 py-1.5 rounded-full uppercase tracking-wider">Tahun Ajaran 2026/2027</p>
                </div>

                <div className="flex justify-center gap-3 mb-8">
                  <div className="w-11 h-11 rounded-2xl bg-blue-950/80 flex items-center justify-center text-red-400 border border-blue-800/60" title="Teknik Mesin">
                    <i className="fa-solid fa-gear text-lg animate-spin-slow"></i>
                  </div>
                  <div className="w-11 h-11 rounded-2xl bg-blue-950/80 flex items-center justify-center text-yellow-400 border border-blue-800/60" title="Teknik Listrik">
                    <i className="fa-solid fa-bolt text-lg"></i>
                  </div>
                  <div className="w-11 h-11 rounded-2xl bg-blue-950/80 flex items-center justify-center text-emerald-400 border border-blue-800/60" title="Teknik Sipil">
                    <i className="fa-solid fa-helmet-safety text-lg"></i>
                  </div>
                  <div className="w-11 h-11 rounded-2xl bg-blue-950/80 flex items-center justify-center text-blue-400 border border-blue-800/60" title="Rekayasa Perangkat Lunak">
                    <i className="fa-solid fa-laptop text-lg"></i>
                  </div>
                </div>

                <form onSubmit={handleLogin} className="text-left mb-8 space-y-4">
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-blue-400/70">
                      <i className="fa-solid fa-file-lines text-lg"></i>
                    </div>
                    <input

                      placeholder="Nomor Induk Siswa Nasional (NISN)"

                    />

                      <i className="fa-solid fa-lock text-lg"></i>

                    <input

                    />

                  {loginError && (

                  <button

                  >
                    <span>Mulai Sesi Ujian</span>
                    <i className="fa-solid fa-arrow-right text-sm"></i>
                  </button>
                </form>

                <p className="mt-6 text-[11px] text-blue-300/60 font-medium leading-relaxed">
                  &copy; 2026 SMKN 4 Tangerang<br />
                  <span className="mt-1 block opacity-75">by siÇasep</span>
                </p>
              </div>
            </div>
          )}

          {screen === 'class-select' && (

              <div className="w-full max-w-md text-center">
                <h2 className="text-2xl font-bold text-white mb-2">Pilih Kelas</h2>
                <p className="text-sm text-blue-300/70 mb-8">Silakan pilih tingkatan kelas yang ingin dipantau.</p>

                <div className="space-y-4">

                  >
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 bg-blue-950 text-blue-400 rounded-full flex items-center justify-center text-xl font-bold border border-blue-800">X</div>
                      <span className="text-lg">Kelas X (Sepuluh)</span>
                    </div>
                    <i className="fa-solid fa-chevron-right text-lg text-blue-400"></i>
                  </button>

                  <button 
                    onClick={() => selectClassForAdmin('Kelas XI')} 
                    className="w-full bg-slate-900/90 border-2 border-blue-800/70 hover:border-blue-400 hover:bg-blue-900/50 text-white font-semibold py-5 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-between px-6"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 bg-blue-950 text-emerald-400 rounded-full flex items-center justify-center text-xl font-bold border border-blue-800">XI</div>
                      <span className="text-lg">Kelas XI (Sebelas)</span>
                    </div>
                    <i className="fa-solid fa-chevron-right text-lg text-blue-400"></i>
                  </button>
                </div>
              </div>
            </div>
          )}

          {screen === 'dashboard' && (
            <div className="h-full w-full flex flex-col relative bg-gradient-to-b from-blue-950 via-slate-900 to-blue-950">
              <header className="bg-blue-900/90 backdrop-blur-md border-b border-blue-800/60 text-white pt-6 pb-3 px-5 rounded-b-[2rem] shadow-lg z-20 shrink-0">
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-3 flex-1 pr-3 min-w-0">
                    <div className="relative w-10 h-10 shrink-0 rounded-full shadow-sm bg-blue-950 flex items-center justify-center p-1 overflow-hidden border border-blue-700/50">
                      <img 
                        src="https://romantic-red-yjloxbvez0.edgeone.app/SMKn4.png" 
                        alt="Logo" 
                        className="w-full h-full object-contain"
                        onError={(e) => { e.target.src = 'https://ui-avatars.com/api/?name=SMKN+4&background=2563eb&color=fff&rounded=true&size=128'; }}
                      />
                    </div>
                    <div className="min-w-0 flex-1">
                      <p className="text-blue-300 text-[10px] font-medium mb-0.5">Selamat datang,</p>
                      <h2 className="text-base font-bold leading-tight pr-2 truncate text-white">{formatHeaderName(currentStudent)}</h2>
                      <div className="flex gap-2 items-center mt-1">
                        <span className="inline-block px-2 py-0.5 bg-blue-800/60 border border-blue-700/50 rounded text-[9px] font-semibold tracking-wider text-blue-200">
                          {currentClass ? currentClass.toUpperCase() : "ADMIN"}
                        </span>
                        <span className="inline-block px-2 py-0.5 bg-blue-950/80 border border-blue-800/60 rounded text-[9px] font-medium tracking-wider truncate max-w-[120px] text-blue-300">
                          {currentNisn === "ADMIN" ? "ROLE: ADMIN" : `NISN: ${currentNisn}`}
                        </span>
                      </div>
                    </div>
                  </div>
                  <button 
                    onClick={() => setLogoutModal(true)} 
                    className="w-9 h-9 bg-blue-800/60 border border-blue-700/50 rounded-full flex items-center justify-center active:scale-95 transition-all shrink-0 hover:bg-blue-700/60"
                  >
                    <i className="fa-solid fa-right-from-bracket text-sm text-white"></i>
                  </button>
                </div>
              </header>

              <div className="shrink-0 pt-3 pb-2 px-5 bg-blue-950/80 z-10 shadow-sm border-b border-blue-900/60">
                <h3 className="text-xs font-semibold text-blue-200 mb-2 flex items-center gap-1.5">
                  <i className="fa-solid fa-calendar-days text-[14px] text-blue-400"></i>
                  Jadwal Hari Ujian
                </h3>
                <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                  {examSchedule.filter(day => isDayVisible(day)).map((day) => {
                    const isActive = day.id === activeDayId;
                    return (
                      <button
                        key={day.id}
                        onClick={() => setActiveDayId(day.id)}
                        className={`flex flex-col items-center justify-center min-w-[70px] py-2 px-2 rounded-xl transition-all ${
                          isActive 
                            ? "bg-blue-600 text-white shadow-md shadow-blue-600/40 border border-blue-400/40" 
                            : "bg-slate-900/90 text-blue-200 border border-blue-800/60 hover:bg-blue-900/40"
                        }`}
                      >
                        <span className="text-[11px] font-semibold mb-0.5">{day.dayName}</span>
                        <span className={`text-[8px] ${isActive ? 'text-blue-100' : 'text-blue-400/70'}`}>Hari {day.id}</span>
                      </button>
                    );
                  })}
                  {examSchedule.filter(day => isDayVisible(day)).length === 0 && (
                    <span className="text-xs text-blue-300/50 italic px-2 mt-1">Tidak ada jadwal ujian untuk hari ini.</span>
                  )}
                </div>
              </div>

              <main className="flex-1 overflow-y-auto p-5 pb-24">
                {activeDayId !== null && examSchedule.find(d => d.id === activeDayId) ? (
                  <div className="space-y-4">
                    <div className="flex items-center gap-2 mb-2">
                      <i className="fa-solid fa-calendar-days text-[14px] text-blue-400"></i>
                      <span className="text-sm font-medium text-blue-200">
                        {examSchedule.find(d => d.id === activeDayId).date}
                      </span>
                    </div>

                    {examSchedule.find(d => d.id === activeDayId).subjects
                      .filter(subject => getSubjectStatus(examSchedule.find(d => d.id === activeDayId), subject).status !== "CLOSED")
                      .map((subject, idx) => {
                        const statusData = getSubjectStatus(examSchedule.find(d => d.id === activeDayId), subject);
                        const status = statusData.status;

                        return (
                          <div 
                            key={idx} 
                            className="bg-slate-900/90 p-5 rounded-3xl shadow-lg border border-blue-800/50 relative overflow-hidden flex flex-col gap-3 transition-all hover:border-blue-700/60"
                          >
                            <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-500 rounded-l-3xl"></div>

                            <div className="flex justify-between items-start pl-2 gap-2">
                              <div>
                                <span className="inline-block px-2.5 py-1 bg-blue-500/20 text-blue-300 border border-blue-500/30 text-[10px] font-bold rounded-md mb-2">
                                  {subject.type}
                                </span>
                                <h3 className="text-base font-bold text-white leading-tight">{subject.name}</h3>
                              </div>
                              <div className="bg-blue-950 px-2.5 py-1 rounded-lg border border-blue-800/60 flex items-center gap-1.5 text-xs font-semibold text-blue-200 whitespace-nowrap">
                                <i className="fa-solid fa-clock text-[14px] text-blue-400"></i> 
                                {subject.time}
                              </div>
                            </div>

                            <div className="w-full h-px bg-blue-900/50 my-1"></div>

                            {status === "WAITING" && (
                              <button disabled className="w-full mt-1 bg-slate-800/90 text-slate-400 font-semibold py-3 rounded-2xl flex items-center justify-center gap-2 cursor-not-allowed border border-slate-700/60">
                                <i className="fa-solid fa-lock text-sm text-slate-400"></i>
                                <span className="text-xs uppercase tracking-wider">TUNGGU SEBENTAR YAA!!</span>
                              </button>
                            )}

                            {status === "UNAUTHORIZED" && (
                              <button disabled className="w-full mt-1 bg-slate-800/90 text-slate-400 font-semibold py-3 rounded-2xl flex items-center justify-center gap-2 cursor-not-allowed border border-slate-700/60">
                                <i className="fa-solid fa-user-xmark text-sm"></i>
                                <span className="text-xs">Akses Ditolak (Khusus Peserta Terdaftar)</span>
                              </button>
                            )}

                            {status === "OPEN" && (
                              subject.isGroup ? (
                                <button 
                                  onClick={() => setGroupModal({ show: true, subjectName: subject.name, options: subject.options })}
                                  className="w-full mt-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-2xl transition-colors flex items-center justify-center gap-2 shadow-md shadow-indigo-600/30"
                                >
                                  <i className="fa-solid fa-list text-sm"></i>
                                  <span className="text-xs tracking-wide">Pilih Mata Pelajaran</span>
                                </button>
                              ) : (
                                <button 
                                  onClick={() => setConfirmModal({ show: true, subject: subject.name, link: subject.link })}
                                  className="w-full mt-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-2xl transition-colors flex items-center justify-center gap-2 shadow-md shadow-blue-600/30"
                                >
                                  <i className="fa-solid fa-pen-to-square text-sm"></i>

                    {examSchedule.find(d => d.id === activeDayId).subjects

                ) : (

                <div className="h-10"></div>
              </main>

              <nav className="absolute bottom-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-blue-900/60 py-3 px-6 pb-6 flex justify-around items-center z-20 shrink-0 shadow-2xl">
                <button className="flex flex-col items-center text-blue-400">
                  <i className="fa-solid fa-calendar-days text-lg mb-1"></i>
                  <span className="text-[10px] font-medium">Beranda</span>
                </button>
                <button 
                  onClick={() => setNavAlert({ show: true, title: 'Rekap Nilai', msg: 'Fitur rekap nilai sedang dalam pengembangan sistem.' })} 
                  className="flex flex-col items-center text-blue-300/50 hover:text-blue-300 transition-colors"
                >
                  <i className="fa-solid fa-file-lines text-lg mb-1"></i>
                  <span className="text-[10px] font-medium">Rekap</span>
                </button>
                <button 
                  onClick={() => setNavAlert({ show: true, title: 'Pusat Bantuan', msg: 'Hubungi Pengawas Ujian Pusat: 0812-XXXX-XXXX' })} 
                  className="flex flex-col items-center text-blue-300/50 hover:text-blue-300 transition-colors"
                >
                  <i className="fa-solid fa-circle-info text-lg mb-1"></i>
                  <span className="text-[10px] font-medium">Bantuan</span>
                </button>
              </nav>
            </div>
          )}

          {screen === 'exam-frame' && (
            <div className="fixed inset-0 bg-slate-900 z-[200] flex flex-col transition-transform duration-300">
              <header className="bg-blue-900 text-white pt-4 pb-2 px-4 flex justify-between items-center shadow-md border-b border-blue-800 shrink-0">
                <button 
                  onClick={() => setExitFrameModal(true)} 
                  className="flex items-center gap-2 bg-blue-800/80 px-3 py-1.5 rounded-lg active:scale-95 transition-all text-blue-100"
                >
                  <i className="fa-solid fa-arrow-left text-sm"></i>
                  <span className="text-xs font-semibold">Kembali</span>
                </button>
                <h2 className="text-sm font-bold truncate max-w-[200px] text-white">{iframeTitle}</h2>
                <div className="w-16"></div>
              </header>
              
              <div className="flex-1 w-full relative bg-slate-950">
                {iframeLoading && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center text-blue-400 z-30 bg-slate-900">
                    <i className="fa-solid fa-spinner fa-spin text-3xl text-blue-400 mb-2 block"></i>
                    <span className="text-xs font-semibold text-blue-200">Memuat Soal Ujian...</span>
                  </div>
                )}
                <iframe 
                  id="google-form-iframe" 
                  className="w-full h-full border-none relative z-20" 
                  src={iframeLink}
                  onLoad={() => setIframeLoading(false)}
                />
              </div>
            </div>
          )}

          {/* Modal Components */}
          {confirmModal.show && (
            <div className="fixed inset-0 bg-black/75 z-[300] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-slate-900 border border-blue-800/60 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl animate-scale-up">
                <div className="w-16 h-16 bg-yellow-500/20 border border-yellow-500/30 text-yellow-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                  <i className="fa-solid fa-triangle-exclamation text-3xl"></i>
                </div>
                <h3 className="text-lg font-bold text-center text-white mb-2">Mulai Ujian?</h3>
                <p className="text-xs text-center text-blue-200/70 mb-6 leading-relaxed">
                  Anda akan diarahkan ke form ujian untuk <strong className="text-white">{confirmModal.subject}</strong>. Pastikan koneksi internet stabil.
                </p>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setConfirmModal({ show: false, subject: '', link: '' })} 
                    className="flex-1 py-3.5 rounded-xl border border-blue-800 text-blue-200 font-bold text-xs active:bg-blue-900/50"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={() => startExam(confirmModal.subject, confirmModal.link)} 
                    className="flex-1 py-3.5 rounded-xl bg-blue-600 text-white font-bold text-xs active:bg-blue-700 shadow-lg shadow-blue-600/30"
                  >
                    Buka Soal
                  </button>
                </div>
              </div>
            </div>
          )}

          {logoutModal && (
            <div className="fixed inset-0 bg-black/75 z-[300] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-slate-900 border border-blue-800/60 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl animate-scale-up">
                <div className="w-16 h-16 bg-slate-800 text-slate-300 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-slate-700">
                  <i className="fa-solid fa-right-from-bracket text-2xl text-slate-300"></i>
                </div>
                <h3 className="text-lg font-bold text-center text-white mb-2">Keluar Sesi?</h3>
                <p className="text-xs text-center text-blue-200/70 mb-6 leading-relaxed">
                  Sesi Anda akan diakhiri dan sistem akan mengembalikan Anda ke halaman awal login.
                </p>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setLogoutModal(false)} 
                    className="flex-1 py-3.5 rounded-xl border border-blue-800 text-blue-200 font-bold text-xs active:bg-blue-900/50"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={handleLogout} 
                    className="flex-1 py-3.5 rounded-xl bg-red-600 text-white font-bold text-xs active:bg-red-700 shadow-lg shadow-red-600/30"
                  >
                    Keluar Sesi
                  </button>
                </div>
              </div>
            </div>
          )}

          {navAlert.show && (
            <div className="fixed inset-0 bg-black/75 z-[300] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-slate-900 border border-blue-800/60 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl animate-scale-up">
                <div className="w-16 h-16 bg-blue-500/20 border border-blue-500/30 text-blue-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                  <i className="fa-solid fa-circle-info text-3xl text-blue-400"></i>
                </div>
                <h3 className="text-lg font-bold text-center text-white mb-2">{navAlert.title}</h3>
                <p className="text-xs text-center text-blue-200/70 mb-6 leading-relaxed">{navAlert.msg}</p>
                <button 
                  onClick={() => setNavAlert({ show: false, title: '', msg: '' })} 
                  className="w-full py-3.5 rounded-xl bg-blue-600 text-white font-bold text-xs active:bg-blue-700 shadow-lg shadow-blue-600/30"
                >
                  Mengerti
                </button>
              </div>
            </div>
          )}

          {exitFrameModal && (
            <div className="fixed inset-0 bg-black/75 z-[400] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-slate-900 border border-blue-800/60 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl animate-scale-up">
                <div className="w-16 h-16 bg-red-500/20 border border-red-500/30 text-red-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                  <i className="fa-solid fa-circle-xmark text-3xl text-red-400"></i>
                </div>
                <h3 className="text-lg font-bold text-center text-white mb-2">Tutup Soal?</h3>
                <p className="text-xs text-center text-blue-200/70 mb-6 leading-relaxed">
                  Pastikan Anda sudah menekan tombol <strong className="text-red-400">'Kirim'</strong> atau <strong className="text-red-400">'Submit'</strong> di dalam form ujian agar jawaban tersimpan!
                </p>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setExitFrameModal(false)} 
                    className="flex-1 py-3.5 rounded-xl border border-blue-800 text-blue-200 font-bold text-xs active:bg-blue-900/50"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={() => {
                      setExitFrameModal(false);
                      setScreen('dashboard');
                      setIframeLink('');
                    }} 
                    className="flex-1 py-3.5 rounded-xl bg-red-600 text-white font-bold text-xs active:bg-red-700 shadow-lg shadow-red-600/30"
                  >
                    Tutup Soal
                  </button>
                </div>
              </div>
            </div>
          )}

          {groupModal.show && (
            <div className="fixed inset-0 bg-black/75 z-[300] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-slate-900 border border-blue-800/60 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl flex flex-col max-h-[80vh] animate-scale-up">
                <div className="flex justify-between items-center mb-4 shrink-0">
                  <h3 className="text-base font-bold text-white">{groupModal.subjectName}</h3>
                  <button 
                    onClick={() => setGroupModal({ show: false, subjectName: '', options: [] })} 
                    className="w-8 h-8 bg-blue-950 border border-blue-800 rounded-full flex items-center justify-center text-blue-300 hover:bg-blue-900 transition-all"
                  >
                    <i className="fa-solid fa-circle-xmark text-lg"></i>
                  </button>
                </div>
                <p className="text-xs text-blue-200/70 mb-4 shrink-0">Silakan pilih opsi mata pelajaran ujian Anda.</p>
                
                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {groupModal.options.map((opt, oIdx) => (
                    <button 
                      key={oIdx}
                      onClick={() => {
                        setGroupModal({ show: false, subjectName: '', options: [] });
                        setTimeout(() => {
                          setConfirmModal({ show: true, subject: `${groupModal.subjectName} - ${opt.name}`, link: opt.link });
                        }, 250);
                      }}
                      className="w-full text-left px-4 py-3 rounded-xl border border-blue-800/60 bg-blue-950/70 hover:bg-blue-800/40 hover:border-blue-400 font-semibold text-xs text-blue-100 transition-colors flex items-center justify-between"
                    >
                      <span>{opt.name}</span>
                      <i className="fa-solid fa-chevron-right text-sm text-blue-400"></i>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
